<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我们的故事 · Our Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <meta name="description" content="记录与你在一起的每一个瞬间" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 漂浮爱心背景 -->
  <div class="heart-bg" id="heartBg" aria-hidden="true"></div>

  <!-- 首页 Hero -->
  <header class="hero" id="top">
    <div class="hero-inner">
      <div class="heart-wrap" id="heartWrap" role="button" tabindex="0" aria-label="点击放出爱心">
        <svg class="big-heart" viewBox="0 0 32 29.6" aria-hidden="true">
          <defs>
            <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff7eb3" />
              <stop offset="55%" stop-color="#ff5e8a" />
              <stop offset="100%" stop-color="#ff3d6e" />
            </linearGradient>
          </defs>
          <path d="M23.6,0c-3.4,0-6.3,2.1-7.6,5.1C14.7,2.1,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,6.4,6.4,11.5,16,21.2
            c9.6-9.7,16-14.8,16-21.2C32,3.8,28.2,0,23.6,0z" fill="url(#heartGrad)" />
        </svg>
        <div class="heart-glow" aria-hidden="true"></div>
      </div>

      <h1 class="hero-title" id="heroTitle">我们的故事</h1>
      <p class="hero-subtitle" id="heroSubtitle">记录与你在一起的每一个瞬间</p>
    </div>

    <!-- 切换选项 -->
    <nav class="tabs" id="tabs" aria-label="回忆分类">
      <button class="tab" data-key="places"><span class="tab-emoji">📍</span><span class="tab-label">一起去过的地方</span></button>
      <button class="tab" data-key="food"><span class="tab-emoji">🍜</span><span class="tab-label">一起吃过的美食</span></button>
      <button class="tab" data-key="activities"><span class="tab-emoji">🎈</span><span class="tab-label">一起做过的事</span></button>
      <button class="tab" data-key="future"><span class="tab-emoji">🌟</span><span class="tab-label">未来的规划</span></button>
    </nav>
  </header>

  <!-- 内容区 -->
  <main class="content" id="content" aria-live="polite">
    <div class="section-head">
      <h2 class="section-title" id="sectionTitle"></h2>
      <p class="section-desc" id="sectionDesc"></p>
    </div>
    <div class="cards" id="cards"></div>
  </main>

  <footer class="footer">
    <p id="footerText">Made with ❤ for you</p>
    <button class="back-top" id="backTop" aria-label="回到顶部">回到顶部 ↑</button>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
